<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>01-demo. (Scroll-Sin-Pagina)</title>
  </head>
  <body>
    <!-- La escena 3D va fija detrás, con fondo transparente.
         Aquí NADA desborda: no hay página que se mueva. Solo contamos el gesto. -->
    <canvas id="lienzo"></canvas>

    <header id="copy">
      <p class="kicker">Ejercicio 02 · S10</p>
      <h1 class="titulo">Sin página.</h1>
      <p class="bajada">El mismo giro del ejercicio 01, pero aquí nada desborda. Scrollea igual.</p>
    </header>

    <!-- Barra de progreso en HTML y CSS -->
    <div id="barra">
      <div id="barra-pista"><div id="barra-relleno"></div></div>
      <b id="barra-porcentaje">0%</b>
    </div>

    <aside id="hud">
      <span>deltaY <b id="delta-y">0</b></span>
      <span>posición <b id="posicion">0</b> / <b id="maximo">0</b></span>
      <span>progreso <b id="progreso">0.00</b></span>
      <span>dir <b id="direccion">—</b></span>
      <span>rot y <b id="rotation-y">0</b>°</span>
    </aside>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
